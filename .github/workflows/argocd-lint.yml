name: ArgoCD Manifest Lint

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  KUBECONFORM_VERSION: "0.7.0"
  HELM_VERSION: "3.17.4"
  ARGOCD_VERSION: "3.1.9"
  # Kubernetes version to validate against (update as needed)
  K8S_VERSION: "1.31.14"
  # Path to your ArgoCD app definitions and manifests
  ARGOCD_APPS_PATH: "__BOOTSTRAP__/apps/"
  MANIFESTS_PATH: "__BOOTSTRAP__/configs"
  CHARTS_PATH: "__BOOTSTRAP__/configs"

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────
  # Job 1: YAML syntax validation
  # ─────────────────────────────────────────────
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        continue-on-error: true
        run: |
          yamllint $(find . -name "*.yaml" -o -name "*.yml" | grep -v ".github" | grep -v "node_modules" | grep -v templates | grep -v values) | tee /tmp/yamllint.log
      
      - name: Upload log artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-log-yamllint
          path: /tmp/yamllint.log
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 2: ArgoCD Application manifest validation
  # ─────────────────────────────────────────────
  argocd-app-lint:
    name: ArgoCD App Manifest Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin

      - name: Validate ArgoCD Application CRDs with kubeconform
        continue-on-error: true
        run: |
          # Validate ArgoCD-specific CRDs (Application, AppProject, ApplicationSet)
          # Using the datreeio CRD schema catalog
          echo "All ArgoCD CRDs manifests (Application, AppProject, ApplicationSet)" | \
          find "$ARGOCD_APPS_PATH" -name "*.yaml" -o -name "*.yml" 2>/dev/null | \
          xargs -r kubeconform \
            -strict \
            -summary \
            -verbose \
            -output pretty \
            -kubernetes-version "$K8S_VERSION" \
            -schema-location default \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            -ignore-missing-schemas | \
          tee /tmp/argocd-app-lint.log

      - name: Validate all manifests in manifests path
        if: ${{ env.MANIFESTS_PATH != '' }}
        continue-on-error: true
        run: |
          echo "All another manifests in manifests path" | \
          find "$MANIFESTS_PATH" -name "*.yaml" -o -name "*.yml" 2>/dev/null | grep -v templates | grep -v values | grep -v "Chart.yaml" | \
          xargs -r kubeconform \
            -strict \
            -summary \
            -verbose \
            -output pretty \
            -kubernetes-version "$K8S_VERSION" \
            -schema-location default \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            -ignore-missing-schemas | \
          tee -a /tmp/argocd-app-lint.log
      
      - name: Upload log artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-log-argocd-app
          path: /tmp/argocd-app-lint.log
          retention-days: 7


  # ─────────────────────────────────────────────
  # Job 3: Helm chart lint + template validate
  # ─────────────────────────────────────────────
  helm-lint:
    name: Helm Chart Lint & Template Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl -sSfL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" \
            | tar xz -C /tmp
          mv /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin

      - name: Install helm-kubeconform
        run: |
          helm plugin install https://github.com/jtyr/kubeconform-helm

      - name: Update Helm dependencies (if needed)
        # Runs before lint on charts with dependencies
        run: |
          while IFS= read -r CHART_DIR; do
            if grep -q "dependencies:" "$CHART_DIR/Chart.yaml" 2>/dev/null; then
              echo "Updating dependencies for $CHART_DIR"
              helm dependency update "$CHART_DIR" || true
            fi
          done < <(find "${CHARTS_PATH}" -name "Chart.yaml" 2>/dev/null | xargs -r dirname | sort -u)

      - name: Lint all Helm charts
        continue-on-error: true
        run: |
          EXIT_CODE=0
          LOG_FILE=/tmp/helm-lint.log

          # Find chart roots (directories containing Chart.yaml)
          while IFS= read -r CHART_DIR; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" | tee -a "$LOG_FILE"
            echo "▶ Linting chart: $CHART_DIR" | tee -a "$LOG_FILE"
           
            helm lint "$CHART_DIR" 2>&1 | tee -a "$LOG_FILE"
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then
              echo "✗ helm lint FAILED: $CHART_DIR" | tee -a "$LOG_FILE"
              EXIT_CODE=1
              continue
            fi
            
            echo "▶ Templating & validating: $CHART_DIR" | tee -a "$LOG_FILE"
            helm template release "$CHART_DIR" 2>&1 | kubeconform \
              -strict -summary -output pretty \
              -kubernetes-version "$K8S_VERSION" \
              -schema-location default \
              -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
              -ignore-missing-schemas 2>&1 | tee -a "$LOG_FILE"

           echo "▶ Validating: $CHART_DIR" | tee -a "$LOG_FILE" 
           helm kubeconform --ignore-missing-schemas "$CHART_DIR" 2>&1 | tee -a "$LOG_FILE"
 
            if [ "${PIPESTATUS[1]}" -ne 0 ]; then
              echo "✗ kubeconform FAILED: $CHART_DIR" | tee -a "$LOG_FILE"
              EXIT_CODE=1
            else
              echo "✓ OK: $CHART_DIR" | tee -a "$LOG_FILE"
            fi
          done < <(find "${CHARTS_PATH}" -name "Chart.yaml" 2>/dev/null | xargs -r dirname | sort -u)
 
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
 
      - name: Set result
        id: set-result
        run: |
          [ "${{ steps.lint.outputs.exit_code }}" = "0" ] \
            && echo "result=success" >> $GITHUB_OUTPUT \
            || echo "result=failure" >> $GITHUB_OUTPUT
 
      - name: Upload log artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-log-helm
          path: /tmp/helm-lint.log
          retention-days: 7
 
      - name: Fail if lint failed
        if: steps.lint.outputs.exit_code != '0'
        run: exit 1



  # ─────────────────────────────────────────────
  # Job 4: Generate HTML report + publish
  # ─────────────────────────────────────────────
  report:
    name: Generate & Publish Report
    runs-on: ubuntu-latest
    needs:
      - yamllint
      - argocd-app-lint
      - helm-lint
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Download all lint log artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lint-log-*
          path: /tmp/lint-logs
          merge-multiple: false
 
      - name: Generate HTML report
        env:
          GITHUB_RUN_ID:     ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA:        ${{ github.sha }}
          GITHUB_REF_NAME:   ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR:      ${{ github.actor }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          JOB_RESULTS: >-
            {
              "yamllint":        "${{ needs.yamllint.result }}",
              "argocd-app-lint": "${{ needs.argocd-app-lint.result }}",
              "helm-lint":       "${{ needs.helm-lint.result }}",
            }
        run: python3 .github/scripts/generate_lint_report.py
 
      - name: Write GitHub Step Summary
        if: always()
        run: cat /tmp/lint-report/index.html >> $GITHUB_STEP_SUMMARY
 
      - name: Deploy to GitHub Pages
        if: ${{ github.event_name != 'pull_request' && always() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
 
          cp /tmp/lint-report/index.html /tmp/index.html
 
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi
 
          cp /tmp/index.html index.html
          git add index.html
          git commit -m "ci: lint report run #${{ github.run_number }} (${GITHUB_SHA::7})" || true
          git push origin gh-pages
 
      - name: Post PR comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              'YAML Lint':        '${{ needs.yamllint.result }}',
              'ArgoCD App Lint':  '${{ needs.argocd-app-lint.result }}',
              'Helm Lint':        '${{ needs.helm-lint.result }}',
            };
            const icon = r => ({ success: '✅', failure: '❌', skipped: '⏭️' }[r] ?? '❓');
            const rows = Object.entries(results)
              .map(([name, r]) => `| ${icon(r)} | \`${name}\` | **${r.toUpperCase()}** |`)
              .join('\n');
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = [
              '## ⎈ ArgoCD Lint Report',
              '',
              '| | Job | Result |',
              '|---|---|---|',
              rows,
              '',
              `> 📋 Full report with logs → [Actions Summary](${runUrl})`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body,
  
            });

  # ─────────────────────────────────────────────
  # Summary gate — all lint jobs must pass
  # ─────────────────────────────────────────────
  lint-gate:
    name: All Lint Checks Passed
    runs-on: ubuntu-latest
    needs:
      - yamllint
      - argocd-app-lint
      - helm-lint
    if: always()
    steps:
      - name: Check all jobs
        run: |
          RESULTS='${{ toJson(needs) }}'
          FAILED=$(echo "$RESULTS" | python3 -c "
          import sys, json
          needs = json.load(sys.stdin)
          failed = [name for name, v in needs.items() if v['result'] not in ('success', 'skipped')]
          if failed:
              print('FAILED: ' + ', '.join(failed))
              sys.exit(1)
          print('All checks passed.')
          ")
