                  connection to the disk and where I/O requests to the disk are satisfied
                  on the local node.

                  Nodes without a local connection are not listed here, even though
                  they can still access the disk over the network on another node
                  (NSD server).'
                type: string
              pool:
                description: pool is the name of the filesystem pool that uses this
                  localdisk. If this is empty, the localdisk is not used by a filesystem.
                type: string
              size:
