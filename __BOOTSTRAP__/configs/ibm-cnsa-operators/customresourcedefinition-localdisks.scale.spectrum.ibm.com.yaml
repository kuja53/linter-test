              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of LocalDisk
            properties:
              device:
                description: 'device specifies the device path that is used at creation
                  time. The device path of a disk may change at later time after node
                  reboots.

                  After the disk is created successfully, use the device parameter
                  in the status to see the devices used for I/O on all nodes with
                  a local connection to the disk.'
                type: string
              existingDataSkipVerify:
                description: existingDataSkipVerify is deprecated and will be removed.
                  Use skipVerify instead.
                type: boolean
              failureGroup:
                description: 'failureGroup is the failure group number for this disk.
                  This parameter is only used if the filesystem that uses this disk
                  is

                  replicated (means the Filesystem parameter spec.replication is "2-way"
                  or "3-way"). The replicas of blocks are written to disks with

                  different failure group numbers.

                  Specify a positive number greater or equal than zero and use quotation
                  marks, for example "2".

                  If this parameter is not specified, the failure group numbers are
                  automatically assigned. Refer to the documentation for more

                  information on automatic failure group assignment.

                  This parameter cannot be changed anymore as soon as the local disk
                  is used by a filesystem.'
                maxLength: 6
                pattern: ^([0-9]*)?$
                type: string
              node:
                description: 'node specifies the kubernetes node name of node where
                  the local disk device path (see "device" parameter) is gathered
                  from at creation time.

                  After the disk is created successfully, use nodeConnections in status
                  to see all nodes with a local connection to the disk.'
                type: string
              nodeConnectionSelector:
                description: 'nodeConnectionSelector selects the nodes which are expected
                  to have a local connection to the disk. If not specified, all

                  nodes are expected to have a local connection to the disk.

                  The operator verifies if the disks are visible on the selected nodes.

                  This parameter must not be specified if the disk is only connected
                  to the node specified in spec.node (type "unshared").'
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: 'A label selector requirement is a selector that
                        contains values, a key, and an operator that

