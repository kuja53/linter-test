                  it is used as a Storage Scale disk. The verification checks if the
                  device is already in use.

                  Set skipVerify to true only if you know what you do.'
                type: boolean
              thinDiskType:
                default: 'no'
                description: 'thinDiskType specfies the space reclaim disk type of
