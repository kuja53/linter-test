apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
provisioner: spectrumscale.csi.ibm.com
parameters:
    version: "2"        
    volBackendFs: {{ .Values.filesystem.remote.name }}
    shared: "true"
    uid: ""
    gid: ""
    inodeLimit: "10000"
reclaimPolicy: Delete
allowVolumeExpansion: true
