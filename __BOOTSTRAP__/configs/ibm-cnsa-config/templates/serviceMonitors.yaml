apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gpfs-filesystem
  namespace: ibm-spectrum-scale
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: "grafanabridge"
  endpoints:
    - port: prometheus
      interval: 30s
      path: /metrics_gpfs_filesystem
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
---
